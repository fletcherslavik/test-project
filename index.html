<!DOCTYPE html>
<html>
<head>
    <title>Math Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Math Quiz</h1>
    <p>Answer all 5 questions and submit your answers!</p>

    <div class="question">
        <p>1. What is 5 + 3?</p>
        <input type="number" id="answer1">
    </div>

    <div class="question">
        <p>2. What is 10 - 4?</p>
        <input type="number" id="answer2">
    </div>

    <div class="question">
        <p>3. What is 6 × 3?</p>
        <input type="number" id="answer3">
    </div>

    <div class="question">
        <p>4. What is 20 ÷ 4?</p>
        <input type="number" id="answer4">
    </div>

    <div class="question">
        <p>5. What is 7 + 8?</p>
        <input type="number" id="answer5">
    </div>

    <br>

    <button onclick="checkAnswers()">Submit Quiz</button>
    <button onclick="resetQuiz()">Reset</button>

    <h2 id="result"></h2>

    <script>
        function checkAnswers() {
            let score = 0;

            let answer1 = document.getElementById("answer1").value;
            let answer2 = document.getElementById("answer2").value;
            let answer3 = document.getElementById("answer3").value;
            let answer4 = document.getElementById("answer4").value;
            let answer5 = document.getElementById("answer5").value;

            if (answer1 == 8) {
                score++;
            }

            if (answer2 == 6) {
                score++;
            }

            if (answer3 == 18) {
                score++;
            }

            if (answer4 == 5) {
                score++;
            }

            if (answer5 == 15) {
                score++;
            }

            document.getElementById("result").innerHTML =
                "You got " + score + " out of 5 correct!";
        }

        function resetQuiz() {
            document.getElementById("answer1").value = "";
            document.getElementById("answer2").value = "";
            document.getElementById("answer3").value = "";
            document.getElementById("answer4").value = "";
            document.getElementById("answer5").value = "";

            document.getElementById("result").innerHTML = "";
        }
    </script>

</body>
</html>
